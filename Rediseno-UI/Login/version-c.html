<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiboo · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Marca */
    --brand-green:  #22C55E;
    --brand-green-hover: #16A34A;
    --brand-blue:   #3b82f6;
    --brand-violet: #8b5cf6;
    --brand-pink:   #ec4899;
    --brand-navy:   #1e293b;

    /* Neutros — fijados por especificación de marca */
    --gray-50:  #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-900: #111827;

    --ink:            var(--gray-900);
    --ink-soft:       var(--gray-500);
    --ink-faint:      var(--gray-400);
    --surface:        var(--gray-50);
    --surface-card:   #FFFFFF;
    --border-soft:    var(--gray-200);
    --border-softer:  var(--gray-100);

    /* Espaciado — escala 4pt */
    --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
    --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px; --space-9: 96px;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 28px;

    --shadow-card:    0 1px 2px rgb(17 24 39 / 0.04), 0 8px 24px -12px rgb(17 24 39 / 0.14);
    --shadow-float:   0 16px 32px -12px rgb(17 24 39 / 0.28), 0 4px 10px -4px rgb(17 24 39 / 0.16);

    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  ::selection { background: color-mix(in srgb, var(--brand-blue) 25%, transparent); }

  html, body {
    margin: 0;
    height: 100%;
    font-family: "Inter", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--surface-card);
  }

  h1, h2, h3 { font-family: "Manrope", "Segoe UI", sans-serif; margin: 0; }

  button { font-family: inherit; }

  .layout {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr);
  }

  /* =========================================================
     PANEL IZQUIERDO — Espacio de novedades (rota cada 7s)
     ========================================================= */
  .promo-panel {
    position: relative;
    overflow: hidden;
    background: #eef0fb;
    margin: var(--space-5);
    border-radius: var(--radius-xl);
  }

  .promo-content {
    position: relative;
    height: 100%;
  }

  .promo-slides {
    position: relative;
    height: 100%;
  }

  .promo-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.6s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
  }
  .promo-slide.is-active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .promo-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Controles del carrusel: barra flotante sobre la imagen */
  .promo-controls {
    position: absolute;
    left: var(--space-6);
    bottom: var(--space-6);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-2) var(--space-3);
    background: rgb(255 255 255 / 0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgb(255 255 255 / 0.28);
    border-radius: 999px;
  }
  .promo-dots { display: flex; gap: var(--space-3); }
  .promo-dot {
    position: relative;
    width: 40px; height: 3px;
    border-radius: 2px;
    background: rgb(255 255 255 / 0.35);
    border: none;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
  }
  .promo-dot .fill {
    position: absolute; inset: 0;
    width: 0%;
    background: #fff;
    border-radius: 2px;
  }
  .promo-dot.is-active .fill { width: 100%; }
  .promo-dot.is-filling .fill { width: 0%; animation: fillDot linear forwards; animation-duration: inherit; }
  @keyframes fillDot { from { width: 0%; } to { width: 100%; } }

  .promo-arrows { display: flex; gap: var(--space-2); }
  .promo-arrow {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgb(17 24 39 / 0.12);
    background: rgb(255 255 255 / 0.9);
    color: var(--gray-900);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background-color 0.18s var(--ease-out-expo), transform 0.18s var(--ease-out-expo);
  }
  .promo-arrow:hover { background: var(--surface-card); transform: translateY(-1px); }
  .promo-arrow svg { width: 16px; height: 16px; }

  /* =========================================================
     PANEL DERECHO — Formulario de login
     ========================================================= */
  .form-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: var(--space-6);
    background: var(--surface-card);
  }

  .form-wrap {
    width: 100%;
    max-width: 380px;
  }

  .brand-mark { display: flex; align-items: center; margin-bottom: var(--space-7); }
  .brand-mark img { height: 55px; width: auto; display: block; }

  .form-heading { margin-bottom: var(--space-6); }
  .form-heading h1 {
    font-size: 1.875rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
    margin-bottom: var(--space-2);
  }
  .form-divider { border: none; border-top: 1px solid var(--gray-100); margin: 0 0 var(--space-6); }
  .form-heading p {
    font-size: 0.9375rem;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
  }

  form { display: flex; flex-direction: column; gap: var(--space-6); }

  .field label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--ink-soft);
    margin-bottom: var(--space-2);
  }

  .input-shell { position: relative; display: flex; align-items: center; }

  .input {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.4;
    padding: 14px var(--space-4);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border-soft);
    background: var(--surface-card);
    color: var(--ink);
    transition: border-color 0.2s var(--ease-out-expo), box-shadow 0.2s var(--ease-out-expo), background-color 0.2s var(--ease-out-expo);
  }
  .input::placeholder { color: var(--ink-faint); }
  .input:hover { border-color: var(--gray-300); }
  .input:focus {
    outline: none;
    background: var(--surface-card);
    border-color: var(--brand-blue);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-blue) 14%, transparent);
  }
  .input.has-toggle { padding-right: 46px; }

  .toggle-visibility {
    position: absolute; right: 6px;
    height: 34px; width: 34px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-radius: var(--radius-sm);
    color: var(--ink-faint); cursor: pointer;
    transition: color 0.18s var(--ease-out-expo), background-color 0.18s var(--ease-out-expo);
  }
  .toggle-visibility:hover { color: var(--ink-soft); background: var(--gray-100); }
  .toggle-visibility svg { width: 20px; height: 20px; }
  .toggle-visibility .icon-off { display: none; }
  .toggle-visibility.is-visible .icon-on { display: none; }
  .toggle-visibility.is-visible .icon-off { display: block; }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin-top: calc(var(--space-2) * -1); }

  .checkbox {
    display: flex; align-items: center; gap: var(--space-2);
    font-size: 0.875rem; color: var(--ink-soft);
    cursor: pointer; user-select: none;
  }
  .checkbox input { width: 17px; height: 17px; accent-color: var(--brand-green); cursor: pointer; }

  .link { font-size: 0.875rem; font-weight: 500; color: var(--brand-blue); text-decoration: none; }
  .link:hover { text-decoration: underline; }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    width: 100%; padding: 15px var(--space-5);
    border-radius: var(--radius-sm);
    font-weight: 600; font-size: 0.9375rem;
    border: 1px solid transparent;
    background: linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-hover) 100%);
    color: white;
    cursor: pointer;
    box-shadow: 0 1px 2px rgb(17 24 39 / 0.06), 0 8px 20px -8px color-mix(in srgb, var(--brand-green) 55%, transparent);
    transition: transform 0.18s var(--ease-out-expo), box-shadow 0.18s var(--ease-out-expo), filter 0.18s var(--ease-out-expo);
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.04); box-shadow: 0 1px 2px rgb(17 24 39 / 0.08), 0 12px 24px -8px color-mix(in srgb, var(--brand-green) 65%, transparent); }
  .btn-primary:active { transform: translateY(0); }

  .form-footer { margin-top: var(--space-7); text-align: center; font-size: 0.875rem; color: var(--ink-faint); }
  .form-footer a { color: var(--ink-soft); font-weight: 500; text-decoration: none; }
  .form-footer a:hover { text-decoration: underline; }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    .promo-panel { display: none; }
    .form-panel { padding: var(--space-6) var(--space-4); }
  }
</style>
</head>
<body>

<div class="layout">

  <section class="promo-panel" id="promoPanel">
    <div class="promo-content">
      <div class="promo-slides">

        <article class="promo-slide is-active" data-slide="0">
          <img src="../Assets/banner-login/img%20tn%20banner.png" alt="Kiboo partners oficiales de Tiendanube" />
        </article>

        <article class="promo-slide" data-slide="1">
          <img src="../Assets/banner-login/img%20ml%20banner%20(1).png" alt="Integrá tu Kiboo con Mercado Libre" />
        </article>

        <article class="promo-slide" data-slide="2">
          <img src="../Assets/banner-login/img%20tn%20efica.png" alt="Kiboo va a estar en Efica" />
        </article>

      </div>

      <div class="promo-controls">
        <div class="promo-dots" id="promoDots"></div>
        <div class="promo-arrows">
          <button class="promo-arrow" id="promoPrev" aria-label="Novedad anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="promo-arrow" id="promoNext" aria-label="Siguiente novedad">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="form-panel">
    <div class="form-wrap">
      <div class="brand-mark"><img src="../Logo/Logo%20Kiboo.svg" alt="Kiboo" /></div>

      <div class="form-heading">
        <h1>Bienvenido de nuevo</h1>
        <p>Ingresá tus datos para acceder a tu cuenta.</p>
      </div>

      <hr class="form-divider" />

      <form autocomplete="off">
        <div class="field">
          <label for="email">Usuario o email</label>
          <div class="input-shell">
            <input class="input" type="text" id="email" name="email" placeholder="Ingresá tu usuario o email" />
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-shell">
            <input class="input has-toggle" type="password" id="password" name="password" placeholder="Ingresá tu contraseña" />
            <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Mostrar contraseña">
              <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.82 21.82 0 0 1-3.22 4.56M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="checkbox"><input type="checkbox" name="remember" />Recordarme</label>
          <a class="link" href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <p class="form-footer">¿Necesitás ayuda? <a href="#">Contactá a nuestro equipo</a></p>
    </div>
  </section>

</div>

<script>
  // --- Toggle de contraseña ---
  const toggle = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  toggle.addEventListener('click', () => {
    const isVisible = password.type === 'text';
    password.type = isVisible ? 'password' : 'text';
    toggle.classList.toggle('is-visible', !isVisible);
    toggle.setAttribute('aria-label', isVisible ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });

  // --- Carrusel de novedades ---
  const AUTOPLAY_MS = 7000;
  const slides = Array.from(document.querySelectorAll('.promo-slide'));
  const dotsWrap = document.getElementById('promoDots');
  const panel = document.getElementById('promoPanel');
  let current = 0;
  let timer = null;

  slides.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'promo-dot';
    dot.setAttribute('aria-label', `Ir a novedad ${i + 1}`);
    dot.innerHTML = '<span class="fill"></span>';
    dot.style.setProperty('--dur', AUTOPLAY_MS + 'ms');
    dot.addEventListener('click', () => goTo(i, true));
    dotsWrap.appendChild(dot);
  });
  const dots = Array.from(dotsWrap.children);

  function goTo(index, userTriggered) {
    current = (index + slides.length) % slides.length;
    slides.forEach((s, i) => s.classList.toggle('is-active', i === current));
    dots.forEach((d, i) => {
      d.classList.toggle('is-active', i === current);
      d.classList.remove('is-filling');
      d.querySelector('.fill').style.animation = 'none';
      void d.offsetWidth;
      d.querySelector('.fill').style.animation = '';
      if (i === current) {
        d.classList.add('is-filling');
        d.querySelector('.fill').style.animationDuration = AUTOPLAY_MS + 'ms';
      }
    });
    if (userTriggered) restart();
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  function restart() {
    clearInterval(timer);
    timer = setInterval(next, AUTOPLAY_MS);
  }

  document.getElementById('promoNext').addEventListener('click', () => goTo(current + 1, true));
  document.getElementById('promoPrev').addEventListener('click', () => goTo(current - 1, true));
  panel.addEventListener('mouseenter', () => clearInterval(timer));
  panel.addEventListener('mouseleave', restart);

  goTo(0, false);
  restart();
</script>

</body>
</html>
