<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/tokens/fonts.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/tokens/colors.css">
<link rel="stylesheet" href="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/tokens/typography.css">
<link rel="stylesheet" href="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/tokens/spacing.css">
<link rel="stylesheet" href="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/tokens/radius.css">
<link rel="stylesheet" href="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/tokens/base.css">
<link rel="stylesheet" href="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/styles.css">
<script src="_ds/kiboo-design-system-3e36d54a-f670-4595-967b-a2b6ab3e754e/_ds_bundle.js"></script>
<style>
  html, body { margin:0; padding:0; }
  a { color:#3A8DFF; text-decoration:none; }
  a:hover { color:#1f6fd8; }
  input::placeholder { color:#858A8C; opacity:1; font-family:Inter, sans-serif; }
</style>
</helmet>
<div style="min-height:100vh; width:100%; position:relative; overflow:hidden; background:{{ bg }}; font-family:'Nunito Sans', system-ui, sans-serif; display:flex; align-items:center; justify-content:center; padding:64px 40px; box-sizing:border-box">
  <div style="position:absolute; top:-408px; right:-232px; width:940px; height:940px; border-radius:50%; background:#434340; opacity:.15; pointer-events:none"></div>
  <div style="position:absolute; bottom:-500px; left:-260px; width:700px; height:700px; border-radius:50%; background:#ffffff; opacity:.12; pointer-events:none"></div>

  <div style="position:relative; width:100%; max-width:1140px; display:grid; grid-template-columns:1fr 478px; gap:64px; align-items:center">

    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:0; color:#fff; max-width:520px">
      <span style="display:inline-block; background:{{ tagColor }}; color:#fff; font-family:'Nunito Sans', sans-serif; font-size:15px; font-weight:600; line-height:1; padding:8px 15px 9px; border-radius:999px">{{ tagLabel }}</span>
      <h1 style="margin:26px 0 0; font-family:Manrope, sans-serif; font-size:44px; font-weight:800; line-height:48px; letter-spacing:-2px; color:#fff; text-wrap:pretty">Kiboo va a estar en Efica<br>del 28 al 30 de julio</h1>
      <p style="margin:16px 0 0; font-family:Manrope, sans-serif; font-size:18px; font-weight:400; line-height:24px; color:rgba(255,255,255,.94); max-width:492px; text-wrap:pretty">Kiboo va a estar presente haciendo demos en vivo para que puedas conocer cómo gestionar stock, ventas, sucursales y mucho más desde un solo lugar.</p>
      <a href="#" style="margin-top:36px; height:46px; box-sizing:border-box; display:inline-flex; align-items:center; gap:22px; background:#fff; border-radius:8px; padding:0 20px 0 22px; box-shadow:0 6px 18px rgba(32,43,56,.10)" style-hover="filter:brightness(.97)">
        <span style="font-family:Inter, sans-serif; font-size:15px; font-weight:600; color:#314251">Quiero más info</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A8DFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
    </div>

    <div style="background:#fff; border-radius:24px; box-shadow:0 18px 48px rgba(32,43,56,.14); padding:62px 66px 72px; box-sizing:border-box">
      <img src="assets/kiboo-logo.svg" alt="Kiboo" style="display:block; width:167px; height:58px">
      <h2 style="margin:48px 0 0; font-family:Inter, sans-serif; font-size:28px; font-weight:600; letter-spacing:-.02em; color:#314251">Iniciar sesión</h2>

      <div style="margin-top:22px; display:flex; flex-direction:column; gap:14px">
        <div style="display:flex; align-items:center; gap:12px; border:1px solid #dfe4ea; border-radius:8px; padding:0 16px; height:46px; background:#fff">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#858A8C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          <input type="text" placeholder="Usuario" style="flex:1; border:0; outline:none; font-family:Inter, sans-serif; font-size:15px; color:#858A8C; background:transparent; min-width:0">
        </div>
        <div style="display:flex; align-items:center; gap:12px; border:1px solid #dfe4ea; border-radius:8px; padding:0 16px; height:46px; background:#fff">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#858A8C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="{{ pwType }}" placeholder="Contraseña" style="flex:1; border:0; outline:none; font-family:Inter, sans-serif; font-size:15px; color:#858A8C; background:transparent; min-width:0">
          <button type="button" onClick="{{ togglePw }}" aria-label="Mostrar contraseña" style="display:flex; align-items:center; justify-content:center; border:0; background:transparent; padding:2px; cursor:pointer">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#858A8C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
          </button>
        </div>
      </div>

      <div style="margin-top:24px; display:flex; align-items:center; justify-content:space-between; gap:16px">
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer">
          <span onClick="{{ toggleRemember }}" style="width:18px; height:18px; border:1.5px solid #cfd6de; border-radius:5px; display:flex; align-items:center; justify-content:center; background:{{ rememberBg }}; border-color:{{ rememberBorder }}">
            <sc-if value="{{ remember }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
          </span>
          <span style="font-family:Inter, sans-serif; font-size:15px; color:#858A8C">Recordarme</span>
        </label>
        <a href="#" style="font-family:Inter, sans-serif; font-size:14px; font-weight:600; color:#314251">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="button" style="margin-top:20px; width:100%; height:46px; border:0; border-radius:10px; background:#2FBF5B; color:#fff; font-family:Inter, sans-serif; font-size:16px; font-weight:600; cursor:pointer; transition:filter 200ms cubic-bezier(.16,1,.3,1)" style-hover="filter:brightness(.95)" style-active="transform:scale(.985)">Iniciar sesión</button>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3A8DFF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#3A8DFF&quot;,&quot;#9C73FB&quot;,&quot;#2FBF5B&quot;,&quot;#434340&quot;],&quot;section&quot;:&quot;Marca&quot;},&quot;tagLabel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Eventos&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;Eventos&quot;,&quot;Integraciones&quot;,&quot;Novedades&quot;],&quot;section&quot;:&quot;Comunicado&quot;},&quot;tagColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9C73FB&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#9C73FB&quot;,&quot;#3A8DFF&quot;,&quot;#2FBF5B&quot;],&quot;section&quot;:&quot;Comunicado&quot;}}">
class Component extends DCLogic {
  state = { showPw: false, remember: false };
  renderVals() {
    const remember = this.state.remember;
    return {
      bg: this.props.bg ?? '#3A8DFF',
      tagColor: this.props.tagColor ?? '#9C73FB',
      tagLabel: this.props.tagLabel ?? 'Eventos',
      pwType: this.state.showPw ? 'text' : 'password',
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
      remember,
      rememberBg: remember ? '#2FBF5B' : '#fff',
      rememberBorder: remember ? '#2FBF5B' : '#cfd6de',
      toggleRemember: () => this.setState(s => ({ remember: !s.remember })),
    };
  }
}
</script>
</body>
</html>
